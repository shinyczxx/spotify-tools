name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json
        
    - name: Install dependencies
      run: |
        # Install root dependencies
        npm install

        # Install client dependencies
        echo "Installing client dependencies..."
        cd client && npm install
        
    - name: Check required secrets
      run: |
        if [ -z "$VITE_SPOTIFY_CLIENT_ID" ]; then
          echo "Error: VITE_SPOTIFY_CLIENT_ID secret is not set."
          exit 1
        fi
        if [ -z "$VITE_SPOTIFY_REDIRECT_URI" ]; then
          echo "Error: VITE_SPOTIFY_REDIRECT_URI secret is not set."
          exit 1
        fi

    - name: Build
      run: |
        cd client && npm run build
      env:
        # Ensure these secrets are set in your repository's GitHub settings under "Settings" > "Secrets and variables" > "Actions"
        VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
        VITE_SPOTIFY_REDIRECT_URI: ${{ secrets.VITE_SPOTIFY_REDIRECT_URI }}
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './client/dist'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false